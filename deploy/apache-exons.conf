# Include INSIDE the existing HTTPS VirtualHost, before any catch-all ProxyPass.
# Requires the existing proxy/proxy_http modules and headers/alias modules.
# Confirm port 8502 is unused. Preserve all existing SSL, HEXEvent and MaxEnt rules.
RedirectMatch 302 ^/exons$ /exons/

ProxyPass /exons/static/ !
Alias /exons/static/ /var/www/exon-conservation/static/
<Directory /var/www/exon-conservation/static/>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
</Directory>

<Location /exons/>
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
</Location>
ProxyPass /exons/ http://127.0.0.1:8502/ connectiontimeout=5 timeout=120
ProxyPassReverse /exons/ http://127.0.0.1:8502/
